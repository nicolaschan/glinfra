---
apiVersion: "kustomize.toolkit.fluxcd.io/v1"
kind: Kustomization
metadata:
  name: monad-base
  namespace: flux-system
spec:
  interval: "1m0s"
  path: "./manifests/monad/_group-monad-base"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: image-versions
