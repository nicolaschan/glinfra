---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: "source.toolkit.fluxcd.io/v1"
kind: HelmRepository
metadata:
  name: charts-jetstack-io
  namespace: cert-manager
spec:
  interval: "1m"
  url: "https://charts.jetstack.io"
---
apiVersion: "helm.toolkit.fluxcd.io/v2"
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: "5m"
  chart:
    spec:
      chart: cert-manager
      version: "1.19.x"
      sourceRef:
        kind: HelmRepository
        name: charts-jetstack-io
        namespace: cert-manager
      interval: "1m"
  values:
    installCRDs: true
    extraArgs:
    - "--enable-certificate-owner-ref=true"
