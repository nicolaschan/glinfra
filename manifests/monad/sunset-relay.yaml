---
apiVersion: v1
kind: Namespace
metadata:
  name: sunset-relay
---
apiVersion: "apps/v1"
kind: Deployment
metadata:
  name: sunset-relay
  namespace: sunset-relay
  labels:
    app: sunset-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sunset-relay
  strategy:
    type: Recreate
  template:
    metadata:
      name: sunset-relay
      labels:
        app: sunset-relay
    spec:
      containers:
      - image: "${GHCR_IO_NICOLASCHAN_SUNSET_RELAY_IMAGE}"
        name: sunset-relay
        args:
        - --identity
        - "/data/identity.key"
        ports:
        - containerPort: 4001
          protocol: TCP
        volumeMounts:
        - mountPath: "/data"
          name: relay-data-volume
      volumes:
      - name: relay-data-volume
        persistentVolumeClaim:
          claimName: relay-data
---
apiVersion: v1
kind: Service
metadata:
  name: sunset-relay
  namespace: sunset-relay
  labels:
    app: sunset-relay
spec:
  selector:
    app: sunset-relay
  ports:
  - port: 4001
    targetPort: 4001
    protocol: TCP
---
apiVersion: "networking.k8s.io/v1"
kind: Ingress
metadata:
  name: sunset-relay
  namespace: sunset-relay
  annotations:
    "cert-manager.io/cluster-issuer": letsencrypt-prod
    "cert-manager.io/private-key-algorithm": ECDSA
    "traefik.ingress.kubernetes.io/router.entrypoints": "web,websecure"
    "traefik.ingress.kubernetes.io/router.middlewares": "default-hsts-middleware@kubernetescrd,default-https-redirect-middleware@kubernetescrd"
spec:
  rules:
  - host: "relay.sunset.chat"
    http:
      paths:
      - path: "/"
        pathType: Prefix
        backend:
          service:
            name: sunset-relay
            port:
              number: 4001
  tls:
  - hosts:
    - "relay.sunset.chat"
    secretName: sunset-relay-cert
---
apiVersion: "image.toolkit.fluxcd.io/v1"
kind: ImageRepository
metadata:
  name: ghcr-io-nicolaschan-sunset-relay-repo
  namespace: sunset-relay
spec:
  image: "ghcr.io/nicolaschan/sunset-relay"
  interval: "5m"
---
apiVersion: "image.toolkit.fluxcd.io/v1"
kind: ImagePolicy
metadata:
  name: ghcr-io-nicolaschan-sunset-relay
  namespace: sunset-relay
spec:
  filterTags:
    pattern: "^master-[0-9]+$"
  imageRepositoryRef:
    name: ghcr-io-nicolaschan-sunset-relay-repo
  policy:
    alphabetical:
      order: asc
---
apiVersion: "image.toolkit.fluxcd.io/v1"
kind: ImageUpdateAutomation
metadata:
  name: ghcr-io-nicolaschan-sunset-relay-update
  namespace: sunset-relay
spec:
  git:
    commit:
      author:
        email: "fluxcdbot@nicolaschan.com"
        name: fluxcdbot
      messageTemplate: "chore: update sunset-relay image"
    push:
      branch: master
  interval: "5m"
  sourceRef:
    kind: GitRepository
    name: nicolaschan-infra
    namespace: default
  update:
    path: "./manifests/monad"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: relay-data
  namespace: sunset-relay
  annotations:
    "kustomize.toolkit.fluxcd.io/prune": disabled
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: "1G"
  storageClassName: local-path
